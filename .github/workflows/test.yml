name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # §6: BIM-koordinatorer kjører Windows. Testes på alle tre fra dag én,
    # ikke først når noen melder at det ikke virker.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Røyktest av CLI
        run: |
          uv run python eksempler/lag_demomodell.py
          uv run tfm-sjekk kontroller
        shell: bash
