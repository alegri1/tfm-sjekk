name: bygg

# Frittstående binærfil (§6): «Mange BIM-koordinatorer har ikke Python
# installert og får ikke lov til å installere det heller.»
#
# Bygges på main og på tag, ikke på hver PR — det tar noen minutter per
# plattform. Poenget er at main alltid skal være mulig å slippe.
#
# På tag går binærene videre til en GitHub-utgivelse. Uten den lever de
# bare som kjøringsartefakter: de utløper etter 90 dager, og den som skal
# laste dem ned må være logget på GitHub. En BIM-koordinator som får en
# lenke skal kunne følge den.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  binaer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            navn: tfm-sjekk-linux
            fil: tfm-sjekk
          - os: macos-latest
            navn: tfm-sjekk-macos
            fil: tfm-sjekk
          - os: windows-latest
            navn: tfm-sjekk-windows
            fil: tfm-sjekk.exe

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      - name: Bygg
        run: uv run pyinstaller tfm-sjekk.spec --noconfirm

      # Binæren testes utenfor prosjektmappa. Kjører den derfra, kan den
      # plukke opp kildekoden ved siden av seg og se ut til å virke selv om
      # noe manglet i bundelen.
      - name: Røyktest av binæren
        shell: bash
        run: |
          exe="$PWD/dist/${{ matrix.fil }}"
          uv run python eksempler/lag_demomodell.py

          arbeid=$(mktemp -d)
          cp eksempler/demo-*.ifc eksempler/avveie.ifc eksempler/tidligfase.ifc eksempler/FIKTIV-*.csv tfm-sjekk.toml "$arbeid/"
          cd "$arbeid"

          # Utdata fanges i en variabel framfor å røres til grep. Stegets shell
          # kjører med pipefail, og `grep -q` avslutter ved første treff — står
          # det flere kontroller etter den vi leter etter, får exe-en SIGPIPE
          # og pipelinen feiler på noe som egentlig gikk bra. Det slo til da
          # T1 og D1 kom etter K9 i lista, og bare på macOS, siden det er et
          # kappløp mellom skriving og lukking.
          kontroller=$("$exe" kontroller)
          echo "$kontroller"
          for k in K1 K9 T1 D1; do
            case "$kontroller" in
              *"$k "*) ;;
              *) echo "kontroller listet ikke $k"; exit 1 ;;
            esac
          done

          # Tre filer tvinger federering, altså prosesspoolen. I en frossen
          # binær starter hver arbeidsprosess exe-en på nytt, og uten
          # freeze_support() i __main__ ender det i BrokenProcessPool.
          # Denne feilen fantes faktisk her, og dukket bare opp i binæren.
          utdata=$("$exe" sjekk demo-rie.ifc demo-riv.ifc demo-elektro.ifc \
            --systemtabell FIKTIV-systemkoder.csv \
            --komponenttabell FIKTIV-komponentkoder.csv \
            --master FIKTIV-tfm-master.csv \
            --config tfm-sjekk.toml \
            --opprettet 2026-01-01T12:00:00Z \
            --ut ut 2>&1) && kode=0 || kode=$?
          echo "$utdata"

          test "$kode" -eq 1 || { echo "forventet exit 1, fikk $kode"; exit 1; }

          # Sjekk at hver fagmodell er lest, ikke at objekttallet er et bestemt
          # tall. Tallet endres hver gang demoen utvides — det sto på 15 og var
          # 17 dagen etter — og et hardkodet tall tester ikke det vi mener:
          # at federeringen fikk med seg alle filene.
          for fil in demo-rie.ifc demo-riv.ifc demo-elektro.ifc; do
            case "$utdata" in
              *"$fil:"*) ;;
              *) echo "fant ingen dekningslinje for $fil — federeringen er brutt"; exit 1 ;;
            esac
          done

          for f in rapport.html funn.csv funn.xlsx funn.bcfzip; do
            test -s "ut/$f" || { echo "manglet ut/$f"; exit 1; }
          done
          echo "binæren skrev alle fire rapportene"

          # Oppsettforslaget skal være en fil verktøyet selv kan lese. Prøven
          # er ikke at fila ser riktig ut, men at en påfølgende kjøring godtar
          # den som --config og faktisk tar forslaget i bruk.
          #
          # avveie.ifc, ikke en demo-fil: demomodellene følger standardoppsettet
          # og gir et tomt forslag, som aldri ville rørt innholdsveien. Der bodde
          # feilen som ga gyldig TOML og gyldig konfigurasjon med halve forslaget
          # borte — ifc_klasser skrevet etter «[pset]» leses som pset.ifc_klasser,
          # og pydantic dropper den ukjente nøkkelen uten å si fra.
          "$exe" oppsett avveie.ifc --ut forslag.toml
          cat forslag.toml
          grep -q "IfcBuildingElementProxy" forslag.toml             || { echo "forslaget manglet klassen utenfor omfanget"; exit 1; }

          # «|| true» er ikke slurv: avveie.ifc har en tilsiktet feil, så sjekk
          # gir exit 1. Steget kjører med «set -e», og en tilordning fra en
          # kommando som feiler river hele steget — uten en eneste melding om
          # hvorfor. Her er exit-koden uinteressant; det er dekningslinja som
          # skal leses.
          uten=$("$exe" sjekk avveie.ifc --ut ut2 2>&1 || true)
          med=$("$exe" sjekk avveie.ifc --config forslag.toml --ut ut3 2>&1 || true)

          case "$uten" in
            *"3 av 4 objekter"*) ;;
            *) echo "uventet utgangspunkt:"; echo "$uten"; exit 1 ;;
          esac
          case "$med" in
            *"4 av 4 objekter"*) ;;
            *) echo "forslaget ble lest, men tok ikke effekt:"; echo "$med"; exit 1 ;;
          esac
          echo "binæren skrev et oppsettforslag som virket da det ble tatt i bruk"

          # Grammatikkforslaget: uttrekket er feilfritt, men hver verdi avvises
          # av én regel. Prøven er at forslaget faktisk fjerner de fem
          # syntaksfunnene og lar duplikatet under dem komme fram.
          "$exe" oppsett tidligfase.ifc --ut fase.toml
          grep -q "krev_plassering = false" fase.toml             || { echo "foreslo ikke krev_plassering"; cat fase.toml; exit 1; }

          uten=$("$exe" sjekk tidligfase.ifc --ut ut4 2>&1 || true)
          med=$("$exe" sjekk tidligfase.ifc --config fase.toml --ut ut5 2>&1 || true)
          case "$uten" in *"5 feil"*) ;; *) echo "uventet: $uten"; exit 1 ;; esac
          case "$med" in *"2 feil"*) ;; *) echo "forslaget tok ikke effekt: $med"; exit 1 ;; esac
          echo "binæren fant grammatikkinnstillingen selv"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.navn }}
          path: dist/${{ matrix.fil }}
          if-no-files-found: error

  utgivelse:
    # Taggen skal være leveransen. Uten dette steget lever binærene bare som
    # kjøringsartefakter: de utløper etter 90 dager, og den som skal laste dem
    # ned må være logget på GitHub og finne fram til en kjøringsside.
    #
    # `needs` er hele poenget. En utgivelse skal ikke kunne inneholde en binær
    # som ikke ble prøvd — røyktesten over er det som gjør filene utgivelige.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # taggens egen melding blir utgivelsesteksten

      - uses: actions/download-artifact@v4
        with:
          path: nedlastet

      # To av de tre heter «tfm-sjekk» og ville kollidert på navn i utgivelsen.
      # Plattformen må uansett stå i filnavnet — det er det den som laster ned
      # trenger å se.
      - name: Navngi binærene etter plattform
        run: |
          mkdir -p utgivelse
          mv nedlastet/tfm-sjekk-linux/tfm-sjekk       utgivelse/tfm-sjekk-linux
          mv nedlastet/tfm-sjekk-macos/tfm-sjekk       utgivelse/tfm-sjekk-macos
          mv nedlastet/tfm-sjekk-windows/tfm-sjekk.exe utgivelse/tfm-sjekk-windows.exe
          ls -l utgivelse

      - name: Utgi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Taggen styrer både tittel og tekst, delt slik git deler den:
          # første linje er emnet, resten er brødteksten. Skrives teksten
          # her i stedet, kan tagg og utgivelse komme fra hverandre uten
          # at noen ser det.
          tittel=$(git tag -l --format='%(contents:subject)' "$tag")
          test -n "$tittel" || tittel="tfm-sjekk $tag"
          git tag -l --format='%(contents:body)' "$tag" > tekst.md

          cat >> tekst.md <<'SLUTT'

          ---

          ## Nedlasting

          Binærene under trenger ingen Python-installasjon (§6).

          | Plattform | Fil |
          |---|---|
          | Windows | `tfm-sjekk-windows.exe` |
          | macOS | `tfm-sjekk-macos` |
          | Linux | `tfm-sjekk-linux` |

          På macOS og Linux må fila gjøres kjørbar først. Kjørerettigheten
          overlever ikke nedlastingen:

              chmod +x tfm-sjekk-macos

          macOS legger i tillegg en usignert binær i karantene, og sier bare at
          fila ikke kan åpnes. Slik slippes den ut:

              xattr -d com.apple.quarantine tfm-sjekk-macos

          Har du Python på maskinen, er `uv tool install tfm-sjekk` enklere.
          SLUTT

          # Kjøres steget om igjen, skal filene byttes ut — ikke feile på at
          # utgivelsen allerede finnes.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tittel" --notes-file tekst.md
            gh release upload "$tag" utgivelse/* --clobber
          else
            gh release create "$tag" utgivelse/* \
              --title "$tittel" \
              --notes-file tekst.md
          fi
          gh release view "$tag"
