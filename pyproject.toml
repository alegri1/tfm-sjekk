[project]
name = "tfm-sjekk"
version = "0.8.2"
description = "Validerer TFM-merking i IFC-modeller mot NS 3457-serien og prosjektets TFM-master"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["ifc", "bim", "tfm", "ns3451", "ns3457", "buildingsmart"]
authors = [
    { name = "grigr", email = "offline.broker199@passinbox.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Other Audience",
    "Natural Language :: Norwegian",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ifcopenshell>=0.8.5",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "typer>=0.27.1",
]

[project.scripts]
tfm-sjekk = "tfm_sjekk.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.9",
    "pyinstaller>=6.22.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003: norske tegn (æøå) i strenger og docstrings er tilsiktet.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# dynamo/ kjører inne i Dynamo, som bruker IronPython 2.7 eller CPython3
# avhengig av versjon og nodetype. UP-reglene moderniserer til py312 og ville
# gjort fila ukjørbar på den eldste av dem. Konsumenten bestemmer, ikke
# målversjonen i denne fila.
# B905: zip(..., strict=) kom i 3.10 og finnes ikke i IronPython. merk() sjekker
# lengdene selv og kaster med en melding som sier hva som er feilkoblet i grafen
# — det er mer opplysende enn ValueError fra zip.
"dynamo/*.py" = ["UP", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["tfm_sjekk"]
