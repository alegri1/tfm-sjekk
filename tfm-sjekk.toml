# Eksempelkonfigurasjon for tfm-sjekk.
#
# Alle verdier under er standardverdier — fila trengs bare der prosjektet
# avviker. §14: TFM-tolkningene varierer, så regelsettet leveres som data.

[grammatikk]
plassering_siffer = 6
systemkode_siffer = 4
system_lopenummer_siffer = 3
undernummer_siffer_min = 2
undernummer_siffer_maks = 3
komponentkode_bokstaver = 3
komponent_lopenummer_siffer = 3
# Sett true hvis prosjektet krever %-delen (komponenttype) på alle objekter.
krev_komponenttype = false

[pset]
# Egenskapssettene TFM-verdiene ligger i. De vanlige i norske Revit-maler
# står først; legg til prosjektets egne foran dem ved behov.
forekomst = ["TFM11_Forekomst"]
type = ["TFM11_Type"]
mmi = ["MMI", "Prosesstatus"]

# Egenskapsnavnet inne i settet. Finner ikke verktøyet noen av disse, tar det
# første ikke-tomme verdi i settet.
egenskapsnavn_forekomst = ["TFM", "TFMForekomst", "Forekomst"]
egenskapsnavn_type = ["TFM", "TFMType", "Type"]

# Klassene K1 krever TFM på. Matches mot hele arvekjeden, så
# «IfcFlowTerminal» dekker også IfcAirTerminal, IfcLamp, IfcOutlet osv.
ifc_klasser = [
    "IfcDistributionElement",
    "IfcFlowTerminal",
    "IfcFlowController",
    "IfcFlowMovingDevice",
    "IfcEnergyConversionDevice",
    "IfcDistributionFlowElement",
]

[elektro]
# Hva som er en fordeling og hva som er en kurs (K8b/K8c). Klassenavnene
# skiller seg mellom IFC 2x3 og IFC4, så begge står her; navn som ikke finnes
# i skjemaet til fila som leses hoppes over.
fordeling_klasser = [
    "IfcElectricDistributionBoard",  # IFC4
    "IfcElectricDistributionPoint",  # IFC 2x3
    "IfcDistributionBoard",          # IFC4.3
]
krets_klasser = [
    "IfcDistributionCircuit",  # IFC4
    "IfcElectricalCircuit",    # IFC 2x3
]

[master]
# Hvor systemene og komponenttypene står i prosjektets TFM-master (K7).
# Det er kolonneoverskriftene som gjenkjennes, ikke arknavnene: alle ark i
# XLSX-en leses, og ark uten en gjenkjennelig kolonne hoppes over.
kolonne_system = ["systemforekomst", "system", "systemid", "tfm-system"]
kolonne_komponenttype = ["komponenttype", "type", "typeid", "tfm-type"]
kolonne_komponentforekomst = ["komponentforekomst", "forekomst", "komponent"]

# Ekte mastere har gjerne logo, prosjektnavn og revisjonstabell over selve
# tabellen. Så mange rader letes det i etter overskriftsraden.
maks_overskriftsrader = 10

# Slå av kontroller eller endre alvorlighetsgrad per kontroll.
# Gyldige grader: "feil", "advarsel", "info".
[kontroller.K4]
alvorlighet = "advarsel"

