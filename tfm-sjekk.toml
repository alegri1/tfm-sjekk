# Eksempelkonfigurasjon for tfm-sjekk.
#
# Alle verdier under er standardverdier — fila trengs bare der prosjektet
# avviker. §14: TFM-tolkningene varierer, så regelsettet leveres som data.

# Stiene til mastera og kodetabellene. Ligger de her, blir kommandoen bare
# «tfm-sjekk sjekk modell.ifc». Relativt til DENNE fila, ikke til der du står,
# slik at mappa kan flyttes og sendes videre.
#
# Se eksempler/tfm-sjekk-full.toml for en utfylt variant.
#
# tfm_master = "TFM-master.xlsx"
# systemtabell = "tabeller/min-ns3451.csv"
# komponenttabell = "tabeller/min-ns3457-8.csv"

# Den faste ruten: hvilke modeller kjøringen leser, og hvor rapporten legges.
# Med disse er runden «tfm-sjekk sjekk» uten argumenter. Filnavn eller mønster,
# relativt til DENNE fila. Filer på kommandolinja vinner, og «--ut» vinner.
#
# Et mønster som ikke treffer noen fil stopper kjøringen med exit 2. Ruten
# skrives én gang og leses aldri igjen; en eksport som havnet i feil mappe ville
# ellers gitt en tom, grønn rapport hver eneste runde, og ingenting i den ville
# sagt at den handlet om null objekter.
#
# modeller = ["eksport/*.ifc"]
# ut = "rapport"

# Klassene K1 krever TFM på. Matches mot hele arvekjeden, så
# «IfcFlowTerminal» dekker også IfcAirTerminal, IfcLamp, IfcOutlet osv.
#
# MÅ STÅ FØR FØRSTE [seksjon]. I TOML hører en nøkkel til seksjonen over den,
# så «ifc_klasser» skrevet lenger nede blir «pset.ifc_klasser» — en nøkkel som
# ikke finnes. Den sto der i denne fila fram til nå, og ble forkastet i
# stillhet hver eneste kjøring.
ifc_klasser = [
    "IfcDistributionElement",
    "IfcFlowTerminal",
    "IfcFlowController",
    "IfcFlowMovingDevice",
    "IfcEnergyConversionDevice",
    "IfcDistributionFlowElement",
]

[grammatikk]
plassering_siffer = 6
systemkode_siffer = 4
system_lopenummer_siffer = 3
undernummer_siffer_min = 2
undernummer_siffer_maks = 3
komponentkode_bokstaver = 3
komponent_lopenummer_siffer = 3
# Sett false i tidligfase, når byggnummeret ikke er bestemt ennå. Da godtas
# «=3600.001.04-JVZ001» uten «++»-delen. En feil plassering avvises fortsatt —
# valgfri betyr at delen kan utelates, ikke at den kan være feil.
krev_plassering = true

# Sett true hvis prosjektet krever %-delen (komponenttype) på alle objekter.
krev_komponenttype = false

[pset]
# Egenskapssettene TFM-verdiene ligger i. De vanlige i norske Revit-maler
# står først; legg til prosjektets egne foran dem ved behov.
forekomst = ["TFM11_Forekomst"]
type = ["TFM11_Type"]
mmi = ["MMI", "Prosesstatus"]

# Egenskapsnavnet inne i settet. Disse navnene brukes også til å lete på tvers av ALLE egenskapssett, ikke
# bare de som står over. Derfor må de være distinkte nok til at et treff er
# bevis. «Type» sto en gang i lista under, og traff
# Pset_ManufacturerTypeInformation i praktisk talt enhver modell — altså
# fabrikatets typebetegnelse, ikke TFM. «TFM» sto der også, og ga hele
# TFM-ID-en som komponenttype, siden det er forekomstens eget kandidatnavn.
egenskapsnavn_forekomst = ["TFM", "TFMForekomst", "Forekomst"]
egenskapsnavn_type = ["TFMType", "TFM11_Type"]

[mmi]
# Prosesstatus/MMI (K9). Skalaen varierer mellom byggherrer; verdiene under
# er den vanlige norske. Tom liste slår av verdisjekken.
gyldige_verdier = ["100", "200", "300", "350", "400", "500"]

# Uten dette sier K9 bare fra om manglende MMI i modeller som ellers bruker
# MMI. Sett true hvis prosjektet krever prosesstatus på alle objekter.
krev_pa_alle = false

[elektro]
# Hva som er en fordeling og hva som er en kurs (K8b/K8c). Klassenavnene
# skiller seg mellom IFC 2x3 og IFC4, så begge står her; navn som ikke finnes
# i skjemaet til fila som leses hoppes over.
fordeling_klasser = [
    "IfcElectricDistributionBoard",  # IFC4
    "IfcElectricDistributionPoint",  # IFC 2x3
    "IfcDistributionBoard",          # IFC4.3
]
krets_klasser = [
    "IfcDistributionCircuit",  # IFC4
    "IfcElectricalCircuit",    # IFC 2x3
]

# Klassene som BÆRER kurser framfor å ligge på en. K8 krever kursnummer av
# elektroobjekter, og et kabelrør har ikke noe kursnummer å ha. Samme grunn som
# at fordelinger er unntatt: tavla er roten kursene går ut fra.
#
# Kjørt uten dette ga en ekte modell med 2439 objekter 1018 funn om rør og bend,
# og 11 om ekte feil.
foring_klasser = [
    "IfcFlowSegment",
    "IfcFlowFitting",
    "IfcCableCarrierSegment",  # IFC4
    "IfcCableCarrierFitting",  # IFC4
    "IfcCableSegment",         # IFC4
    "IfcCableFitting",         # IFC4
]

# Systemkodene som ER føringsvei, uansett hvilken IFC-klasse objektet fikk.
#
# Klassen over sier hva eksporten fikk til. Denne sier hva prosjektet har
# bestemt at objektet er. Når de to er uenige, er det prosjektet som har svart:
# en ekte Revit-eksport ga seksten koblingsbokser som IfcBuildingElementProxy —
# TFM-en sa føringsvei, klassen sa ingenting, og K8 trodde på klassen.
#
# TOM SOM STANDARD. Hvilken kode som betyr føringsvei står i NS 3451, som er en
# betalt standard, og innholdet skal ikke ligge i verktøyet (§8). Skriv inn
# prosjektets egne — typisk én kode:
#
#     foring_systemkoder = ["4360"]
#
# De to listene virker ved siden av hverandre: et objekt er unntatt hvis
# klassen ELLER systemkoden sier at det er en føringsvei.
foring_systemkoder = []

[master]
# Hvor systemene og komponenttypene står i prosjektets TFM-master (K7).
# Det er kolonneoverskriftene som gjenkjennes, ikke arknavnene: alle ark i
# XLSX-en leses, og ark uten en gjenkjennelig kolonne hoppes over.
kolonne_system = ["systemforekomst", "system", "systemid", "tfm-system"]
kolonne_komponenttype = ["komponenttype", "type", "typeid", "tfm-type"]
kolonne_komponentforekomst = ["komponentforekomst", "forekomst", "komponent"]

# Ekte mastere har gjerne logo, prosjektnavn og revisjonstabell over selve
# tabellen. Så mange rader letes det i etter overskriftsraden.
maks_overskriftsrader = 10

# OMFANG PER FAGMODELL. En federering blander filer med ulikt ansvar:
# arkitekten tegner armaturer og servanter for å vise rommet, og de skal ikke
# merkes av RIE. Kjørt mot Autodesks Snowdon Towers ga arkitektmodellen 675
# K1-funn på slikt utstyr, mot 177 ekte funn i elektromodellen.
#
# Nøkkelen er et filnavnmønster. TOM LISTE betyr at fila ikke kontrolleres for
# TFM — og det er den eneste måten å unnta på.
#
#     [fagmodell."*Architectural*"]
#     ifc_klasser = []
#
# En unntatt fil er ikke usynlig. K3–K8 leser alle objekter med en TFM-verdi,
# uansett klasse, så K6 finner fortsatt duplikater på tvers av den og RIE —
# som er hele grunnen til å federere. Bare K1 og dekningen følger omfanget.
#
# Treffer flere mønstre samme fil, gjelder det lengste. To like lange stopper
# kjøringen: da finnes det ikke noe riktig svar, og verktøyet gjetter ikke.
# Merk at Revit navngir lenkede eksporter etter verten, så ARK-fila kan hete
# «...Electrical-...Architectural.ifc» og inneholde begge fagnavnene.

# Slå av kontroller eller endre alvorlighetsgrad per kontroll.
# Gyldige grader: "feil", "advarsel", "info".
[kontroller.K4]
alvorlighet = "advarsel"

# [kontroller.K8]
# aktiv = false
